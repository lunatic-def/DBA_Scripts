          WHERE wait_type IN
          (
            'WRITELOG',
            'LCK_M_X',
            'PAGELATCH_EX',
            'PAGELATCH_SH',
            'CXPACKET',
            'CXCONSUMER',
            'ASYNC_NETWORK_IO'
          );
        columns:
          - name: sql_instance
            type: tag
          - name: dbmonitor.waits.writelog_ms
            type: rate
          - name: dbmonitor.waits.lck_m_x_ms
            type: rate
          - name: dbmonitor.waits.pagelatch_ex_ms
            type: rate
          - name: dbmonitor.waits.pagelatch_sh_ms
            type: rate
          - name: dbmonitor.waits.cxpacket_ms
            type: rate
          - name: dbmonitor.waits.cxconsumer_ms
            type: rate
          - name: dbmonitor.waits.async_network_io_ms
            type: rate
        tags:
          - 'custom_query:dbmonitor_waits'
        collection_interval: 5 #seconds
      - query: |
          WITH latest_cpu AS
            (
              SELECT TOP (1) 
                CAST(rb.record AS XML) AS record_xml,  
                (SELECT TOP 1 cpu_count FROM sys.dm_os_sys_info) AS CPUs
              FROM sys.dm_os_ring_buffers AS rb
              WHERE rb.ring_buffer_type = N'RING_BUFFER_SCHEDULER_MONITOR'
                AND rb.record LIKE N'%<SystemHealth>%'
              ORDER BY rb.timestamp DESC
            )
            SELECT
              @@SERVERNAME AS sql_instance,
              latest_cpu.record_xml.value('(./Record/SchedulerMonitorEvent/SystemHealth/ProcessUtilization)[1]', 'int') 
              / CASE WHEN CPUs > 64 THEN 4 ELSE 1 END AS sql_cpu_percent,
              latest_cpu.record_xml.value('(./Record/SchedulerMonitorEvent/SystemHealth/SystemIdle)[1]', 'int') AS system_idle_percent,
              100
                - (latest_cpu.record_xml.value('(./Record/SchedulerMonitorEvent/SystemHealth/ProcessUtilization)[1]', 'int') / CASE WHEN CPUs > 64 THEN 4 ELSE 1 END)
                - latest_cpu.record_xml.value('(./Record/SchedulerMonitorEvent/SystemHealth/SystemIdle)[1]', 'int') AS other_process_cpu_percent
            FROM latest_cpu;
        columns:
          - name: sql_instance
            type: tag
          - name: dbmonitor.cpu.sql_cpu_percent
            type: gauge
          - name: dbmonitor.cpu.system_idle_percent
            type: gauge
          - name: dbmonitor.cpu.other_process_cpu_percent
            type: gauge
        tags:
          - 'custom_query:dbmonitor_cpu'
        collection_interval: 5 #seconds
      - query: |
          SELECT
            @@SERVERNAME AS sql_instance,
            SUM(runnable_tasks_count) AS runnable_tasks_count,
            SUM(current_tasks_count) AS current_tasks_count,
            SUM(active_workers_count) AS active_workers_count,
            SUM(work_queue_count) AS work_queue_count,
            SUM(pending_disk_io_count) AS pending_disk_io_count
          FROM sys.dm_os_schedulers
          WHERE status = 'VISIBLE ONLINE';
        columns:
          - name: sql_instance
            type: tag
          - name: dbmonitor.cpu.runnable_tasks_count
            type: gauge
          - name: dbmonitor.cpu.current_tasks_count
            type: gauge
          - name: dbmonitor.cpu.active_workers_count
            type: gauge
          - name: dbmonitor.cpu.work_queue_count
            type: gauge
          - name: dbmonitor.cpu.pending_disk_io_count
            type: gauge
        tags:
          - 'custom_query:dbmonitor_cpu'
        collection_interval: 5 #seconds
    tags:  # Optional
    #   - 'service:<CUSTOM_SERVICE>'
      - 'env:prod'
